global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

receivers:
  # No notification channel wired up yet — alerts are visible at
  # http://localhost:9093 but nothing is dispatched externally.
  # To forward to Slack, add under this receiver:
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
  #       channel: "#trading-alerts"
  - name: default
