groups:
  - name: service-health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unreachable for 2 minutes."

      # prometheus-net.AspNetCore's UseHttpMetrics() exposes http_request_duration_seconds
      # for oms/ems only — Python services don't emit per-request HTTP metrics.
      - alert: HighHttpErrorRate
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{code=~"5.."}[5m]))
          /
          sum by (job) (rate(http_request_duration_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 5xx rate above 5%"
          description: "{{ $labels.job }} has returned 5xx responses for more than 5% of requests over the last 5 minutes."

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 latency above 1s"
          description: "{{ $labels.job }} p95 request latency has exceeded 1s for 5 minutes."
