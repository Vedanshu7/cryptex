# MirrorMaker 2 config — mirrors each region's order-requests topic from the
# central Kafka broker onto that region's own broker, one-directional
# (central -> region only; regional OMS/EMS never write back to central).
#
# Run via: connect-mirror-maker /mm2.properties (bundled in confluentinc/cp-kafka).
#
# IdentityReplicationPolicy keeps the topic name unchanged across the mirror
# (the default DefaultReplicationPolicy would rename it to
# "central.tokyo.order-requests", which EmsTopicSettingsDeriver/
# OmsTopicSettingsDeriver know nothing about) — oms-tokyo consumes
# "tokyo.order-requests" on kafka-tokyo exactly as it would on the old single
# shared broker, no code change required.
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

clusters = central, tokyo, sgp, eu

central.bootstrap.servers = kafka:9092
tokyo.bootstrap.servers   = kafka-tokyo:9092
sgp.bootstrap.servers     = kafka-sgp:9092
eu.bootstrap.servers      = kafka-eu:9092

# Only these three source -> target pairs are active. Every other pair
# (region -> central, region -> region) is left at its default of disabled —
# this stack has no cross-region or region-to-central Kafka traffic by design.
central->tokyo.enabled = true
central->tokyo.topics  = tokyo\.order-requests

central->sgp.enabled = true
central->sgp.topics  = sgp\.order-requests

central->eu.enabled = true
central->eu.topics  = eu\.order-requests

# No consumer-group failover needed — regional OMS never reads from central,
# so there's nothing for a checkpoint/heartbeat to help fail over.
emit.checkpoints.enabled  = false
emit.heartbeats.enabled   = false
sync.group.offsets.enabled = false

# Local single-node dev brokers only have one broker each — every internal
# MM2 topic (offsets, configs, status) must ask for replication factor 1 or
# the connectors fail to start.
replication.factor                      = 1
checkpoints.topic.replication.factor    = 1
heartbeats.topic.replication.factor     = 1
offset-syncs.topic.replication.factor   = 1
offset.storage.replication.factor       = 1
config.storage.replication.factor       = 1
status.storage.replication.factor       = 1

tasks.max = 1
refresh.topics.interval.seconds = 10
sync.topic.configs.enabled = true
