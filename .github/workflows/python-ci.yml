name: Pipeline CI

on:
  pull_request:
    paths: ["pipeline/**"]
  push:
    branches: [main]
    paths: ["pipeline/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install service dependencies
        # Installs each service's own pinned requirements.txt rather than a
        # hand-curated flat list — the latter drifted stale (missing
        # quixstreams/websockets) after candle_aggregator and signal_router
        # migrated to Quix Streams. All four share one venv here (matching
        # local dev's documented single-venv quality gate), so their pins
        # must stay mutually compatible — see cryptography/confluent-kafka/
        # pydantic version notes in candle_aggregator and signal_router's
        # requirements.txt.
        run: |
          for service in exchange_connector candle_aggregator signal_pipeline signal_router; do
            pip install -r "$service/requirements.txt"
          done

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy shared/ exchange_connector/src/ candle_aggregator/src/ signal_router/src/ signal_pipeline/src/
        continue-on-error: true  # mypy on sklearn/numpy imports can be noisy

      - name: Validate trading universe
        run: |
          PYTHONPATH=${{ github.workspace }}/pipeline \
          python3 ../scripts/validate_universe.py universe.json

      - name: Unit tests
        run: |
          PYTHONPATH=${{ github.workspace }}/pipeline \
          pytest shared/tests/ exchange_connector/tests/ candle_aggregator/tests/ \
                  signal_pipeline/tests/ signal_router/tests/ \
            -m "not integration" --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: pipeline/coverage.xml
